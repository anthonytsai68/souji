name: Build

on:
  push:
    branches: [main, souji-v1]
  pull_request:
    branches: [main, souji-v1]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Universal Binary)
        run: |
          xcodebuild -project Souji.xcodeproj \
            -scheme Souji \
            -configuration Release \
            -derivedDataPath build \
            build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package DMG
        run: |
          APP_DIR="build/Build/Products/Release"
          mkdir -p dist
          cp -R "$APP_DIR/Souji.app" dist/
          hdiutil create -volname Souji -srcfolder dist -ov -format UDZO Souji.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Souji
          path: Souji.dmg
