name: Souji
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.0.0
options:
  bundleIdPrefix: com.souji
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: "NO"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: "Automatic"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_ENTITLEMENTS: "Souji/Souji.entitlements"
    INFOPLIST_FILE: "Souji/Info.plist"
    PRODUCT_BUNDLE_IDENTIFIER: "com.souji.app"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    COMBINE_HIDPI_IMAGES: "YES"

targets:
  Souji:
    type: application
    platform: macOS
    sources:
      - Souji
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: Souji
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"

  SoujiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SoujiTests
    dependencies:
      - target: Souji
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"

schemes:
  Souji:
    build:
      targets:
        Souji: all
        SoujiTests: [test]
    test:
      targets:
        - name: SoujiTests
